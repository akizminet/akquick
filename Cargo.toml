[package]
name = "akquick"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.9"
gtk4-layer-shell = "0.4"
libadwaita = "0.7"
glib = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zbus = { version = "5", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
