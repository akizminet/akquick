<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 30" width="630" height="30" fill="none">
  <!-- Minimalist Pill -->
  <rect x="1" y="1" width="628" height="28" rx="14" fill="#1e1e2e" fill-opacity="0.45" stroke="#313244" stroke-width="1"/>

  <!-- 1. CPU -->
  <circle cx="16" cy="15" r="10" fill="#74c7ec" fill-opacity="0.15"/>
  <g transform="translate(10, 9)">
    <rect x="2" y="2" width="8" height="8" rx="2" stroke="#74c7ec" stroke-width="1.2"/>
    <rect x="4" y="4" width="4" height="4" rx="0.5" fill="#74c7ec"/>
  </g>
  <text x="31" y="19" fill="#74c7ec" font-family="monospace" font-size="11.5" font-weight="600">14%</text>

  <!-- 2. RAM -->
  <circle cx="78" cy="15" r="10" fill="#f5c2e7" fill-opacity="0.15"/>
  <g transform="translate(71, 9.5)">
    <rect x="1" y="1" width="12" height="9" rx="1.5" stroke="#f5c2e7" stroke-width="1.2"/>
    <rect x="3" y="3" width="2" height="3" fill="#f5c2e7"/>
    <rect x="6" y="3" width="2" height="3" fill="#f5c2e7"/>
    <rect x="9" y="3" width="2" height="3" fill="#f5c2e7"/>
  </g>
  <text x="94" y="19" fill="#f5c2e7" font-family="monospace" font-size="11.5" font-weight="600">6.3G</text>

  <!-- 3. Wi-Fi -->
  <circle cx="155" cy="15" r="10" fill="#89b4fa" fill-opacity="0.15"/>
  <g transform="translate(147, 7.5)">
    <path d="M1 4C3 2 5.5 1 8 1s5 1 7 3" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M3 6.5c1.3-1 2.9-1.5 5-1.5s3.7.5 5 1.5" stroke="#74c7ec" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="8" cy="11" r="1.2" fill="#89b4fa"/>
  </g>
  <text x="171" y="19" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12" font-weight="500">akizminet 5G</text>

  <!-- 4. Speed -->
  <circle cx="280" cy="15" r="10" fill="#a6e3a1" fill-opacity="0.15"/>
  <path d="M280 10v9M277 16l3 3 3-3" stroke="#a6e3a1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="295" y="19" fill="#a6e3a1" font-family="monospace" font-size="11.5" font-weight="600">75K</text>

  <circle cx="340" cy="15" r="10" fill="#fab387" fill-opacity="0.15"/>
  <path d="M340 19v-9M337 13l3-3 3 3" stroke="#fab387" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="355" y="19" fill="#fab387" font-family="monospace" font-size="11.5" font-weight="600">179K</text>

  <!-- 5. Bluetooth -->
  <circle cx="410" cy="15" r="10" fill="#b4befe" fill-opacity="0.15"/>
  <g transform="translate(403, 7.5)">
    <path d="M4 4l7 7-3.5 3.5V1l3.5 3.5L4 12" stroke="#b4befe" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12.5" cy="7.5" r="1.2" fill="#a6e3a1"/>
  </g>

  <!-- 6. Audio -->
  <circle cx="455" cy="15" r="10" fill="#94e2d5" fill-opacity="0.15"/>
  <g transform="translate(448, 8)">
    <path d="M7 3L3.5 6H1v4h2.5L7 13V3z" fill="#94e2d5"/>
    <path d="M10 5.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5" stroke="#94e2d5" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="472" y="19" fill="#94e2d5" font-family="monospace" font-size="11.5" font-weight="600">36%</text>

  <!-- 7. Mic -->
  <circle cx="525" cy="15" r="10" fill="#cba6f7" fill-opacity="0.15"/>
  <g transform="translate(518, 8)">
    <rect x="4.5" y="1" width="4" height="7" rx="2" fill="#cba6f7"/>
    <path d="M2 5v1a4.5 4.5 0 0 0 9 0V5" stroke="#cba6f7" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="6.5" y1="10.5" x2="6.5" y2="13" stroke="#cba6f7" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <text x="542" y="19" fill="#cba6f7" font-family="monospace" font-size="11.5" font-weight="600">100%</text>
</svg>
