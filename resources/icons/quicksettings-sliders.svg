<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="cs-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="cs-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.6" flood-color="#89b4fa" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="24" height="24" rx="6" fill="#1e1e2e" fill-opacity="0.6"/>
  <!-- Top Slider Track -->
  <rect x="3.5" y="6" width="17" height="3.5" rx="1.75" fill="#313244"/>
  <rect x="3.5" y="6" width="10.5" height="3.5" rx="1.75" fill="url(#cs-grad1)"/>
  <!-- Top Slider Knob -->
  <circle cx="14" cy="7.75" r="3" fill="#cdd6f4" filter="url(#glow1)"/>
  <circle cx="14" cy="7.75" r="1.4" fill="#1e1e2e"/>
  <!-- Bottom Slider Track -->
  <rect x="3.5" y="14.5" width="17" height="3.5" rx="1.75" fill="#313244"/>
  <rect x="3.5" y="14.5" width="14" height="3.5" rx="1.75" fill="url(#cs-grad2)"/>
  <!-- Bottom Slider Knob -->
  <circle cx="17.5" cy="16.25" r="3" fill="#cdd6f4" filter="url(#glow1)"/>
  <circle cx="17.5" cy="16.25" r="1.4" fill="#1e1e2e"/>
</svg>
