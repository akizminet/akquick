<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 32" width="630" height="32" fill="none">
  <!-- Chip 1: Telemetry Chip (CPU & RAM) -->
  <rect x="2" y="2" width="136" height="28" rx="6" fill="#313244" fill-opacity="0.75" stroke="#45475a" stroke-width="1"/>
  <!-- CPU -->
  <g transform="translate(10, 7.5)">
    <rect x="3" y="3" width="11" height="11" rx="2.5" stroke="#74c7ec" stroke-width="1.4" fill="#74c7ec" fill-opacity="0.15"/>
    <rect x="6" y="6" width="5" height="5" rx="1" fill="#74c7ec"/>
    <path d="M5.5 1v2m3 0V1m3 2V1M5.5 14v2m3-2v2m3-2v2M1 5.5h2m0 3H1m2 3H1M14 5.5h2m-2 3h2m-2 3h2" stroke="#74c7ec" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <text x="31" y="20.5" fill="#74c7ec" font-family="monospace" font-size="11.5" font-weight="600">14%</text>
  <!-- RAM -->
  <g transform="translate(67, 8)">
    <rect x="1" y="2" width="13" height="10" rx="2" stroke="#f5c2e7" stroke-width="1.3" fill="#f5c2e7" fill-opacity="0.15"/>
    <rect x="3" y="4" width="2" height="3" rx="0.5" fill="#f5c2e7"/>
    <rect x="6" y="4" width="2" height="3" rx="0.5" fill="#f5c2e7"/>
    <rect x="9" y="4" width="2" height="3" rx="0.5" fill="#f5c2e7"/>
  </g>
  <text x="87" y="20.5" fill="#f5c2e7" font-family="monospace" font-size="11.5" font-weight="600">6.3G</text>

  <!-- Chip 2: Wi-Fi Chip -->
  <rect x="144" y="2" width="136" height="28" rx="6" fill="#313244" fill-opacity="0.75" stroke="#45475a" stroke-width="1"/>
  <g transform="translate(154, 7)">
    <path d="M1 4.5C3.5 2 7 1 10 1s6.5 1 9 3.5" stroke="#89b4fa" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <path d="M3.5 7.5c2-1.6 4.2-2.3 6.5-2.3s4.5.7 6.5 2.3" stroke="#74c7ec" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <circle cx="10" cy="13" r="1.4" fill="#89b4fa"/>
  </g>
  <text x="180" y="20.5" fill="#cdd6f4" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="600">akizminet 5G</text>

  <!-- Chip 3: Speed Chip -->
  <rect x="286" y="2" width="126" height="28" rx="6" fill="#313244" fill-opacity="0.75" stroke="#45475a" stroke-width="1"/>
  <g transform="translate(296, 9)">
    <path d="M4 1v11M1 8l3 4 3-4" stroke="#a6e3a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="309" y="20.5" fill="#a6e3a1" font-family="monospace" font-size="11.5" font-weight="600">75K</text>
  <g transform="translate(344, 9)">
    <path d="M4 12V1M1 5l3-4 3 4" stroke="#fab387" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="357" y="20.5" fill="#fab387" font-family="monospace" font-size="11.5" font-weight="600">179K</text>

  <!-- Chip 4: Bluetooth Chip -->
  <rect x="418" y="2" width="38" height="28" rx="6" fill="#313244" fill-opacity="0.75" stroke="#45475a" stroke-width="1"/>
  <g transform="translate(428, 7)">
    <path d="M4 4.5l8 8-4 4V1l4 4-8 8" stroke="#b4befe" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="9" r="1.5" fill="#a6e3a1"/>
  </g>

  <!-- Chip 5: Audio & Mic Chip -->
  <rect x="462" y="2" width="150" height="28" rx="6" fill="#313244" fill-opacity="0.75" stroke="#45475a" stroke-width="1"/>
  <g transform="translate(472, 7)">
    <path d="M8 3.5L4 7H1v4h3l4 3.5V3.5z" fill="#94e2d5"/>
    <path d="M11.5 6.5c1 .8 1.5 1.8 1.5 2.8s-.5 2-1.5 2.8" stroke="#94e2d5" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M14 4.5c1.8 1.4 2.5 3 2.5 4.8s-.7 3.4-2.5 4.8" stroke="#74c7ec" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="495" y="20.5" fill="#94e2d5" font-family="monospace" font-size="11.5" font-weight="600">36%</text>

  <line x1="529" y1="8" x2="529" y2="24" stroke="#45475a" stroke-width="1"/>

  <g transform="translate(539, 7)">
    <rect x="5" y="1" width="5" height="9" rx="2.5" fill="#cba6f7"/>
    <path d="M2 6.5v1.5a5.5 5.5 0 0 0 11 0V6.5" stroke="#cba6f7" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="7.5" y1="13.5" x2="7.5" y2="16" stroke="#cba6f7" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="11" y2="16" stroke="#cba6f7" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="559" y="20.5" fill="#cba6f7" font-family="monospace" font-size="11.5" font-weight="600">100%</text>
</svg>
