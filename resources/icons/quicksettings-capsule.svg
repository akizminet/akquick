<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="nc-track" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="60%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <filter id="nc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Capsule Housing -->
  <rect x="1" y="4.5" width="22" height="15" rx="7.5" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <!-- Active Gradient Track -->
  <rect x="2.5" y="6" width="19" height="12" rx="6" fill="url(#nc-track)"/>
  <!-- Switch Button Knob -->
  <circle cx="15.5" cy="12" r="5" fill="#181825" filter="url(#nc-shadow)"/>
  <!-- Inner Toggle Icon -->
  <line x1="13.5" y1="10.5" x2="17.5" y2="10.5" stroke="#cdd6f4" stroke-width="1" stroke-linecap="round"/>
  <circle cx="14.5" cy="10.5" r="0.8" fill="#89b4fa"/>
  <line x1="13.5" y1="13.5" x2="17.5" y2="13.5" stroke="#cdd6f4" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16.5" cy="13.5" r="0.8" fill="#94e2d5"/>
  <!-- Inactive Dot -->
  <circle cx="7" cy="12" r="1.6" fill="#181825" fill-opacity="0.4"/>
</svg>
